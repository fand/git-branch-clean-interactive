name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gbc-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gbc

      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gbc-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gbc.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare artifacts for release
        run: |
          mkdir -p release
          cp artifacts/gbc-x86_64-unknown-linux-gnu/gbc release/gbc-linux-x86_64
          cp artifacts/gbc-x86_64-apple-darwin/gbc release/gbc-macos-x86_64
          cp artifacts/gbc-aarch64-apple-darwin/gbc release/gbc-macos-arm64
          cp artifacts/gbc-x86_64-pc-windows-msvc/gbc.exe release/gbc-windows-x86_64.exe
          cd release
          chmod +x gbc-linux-x86_64 gbc-macos-x86_64 gbc-macos-arm64
          tar -czf gbc-linux-x86_64.tar.gz gbc-linux-x86_64
          tar -czf gbc-macos-x86_64.tar.gz gbc-macos-x86_64
          tar -czf gbc-macos-arm64.tar.gz gbc-macos-arm64
          zip gbc-windows-x86_64.zip gbc-windows-x86_64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/gbc-linux-x86_64.tar.gz
            release/gbc-macos-x86_64.tar.gz
            release/gbc-macos-arm64.tar.gz
            release/gbc-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
